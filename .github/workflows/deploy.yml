name: 编译worldguard扩展flag加强版

on:
  #对应的是 UTC 时间，需要转换，0 代表北京时间8点，每个月4日/18日12点编译一次
  #关闭则手动编译
  workflow_dispatch:

  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions: write-all

jobs:
  build:
    name: maven 编译
    runs-on: ubuntu-latest
	
    steps:
	  - name: 检测系统
	    uses: actions/checkout@v4
	  - name: 设置JDK 25
	    uses: actions/setup-java@v4
	    with:
	  	  java-version: '25'
	  	  distribution: 'temurin'
	  	  cache: maven	  
	  - name: 使用Maven编译
	    run: mvn -B package --file pom.xml
	    
	  - name: 检测编译完的插件
	    run: |
	  	  mkdir -p ./upload
	  	  ls
	  	  cp -f Spigot/target/*.jar ./upload/
	  	  cd ./upload/
	  	  ls
	  	  echo "FIRMWARE=$PWD" >> $GITHUB_ENV

	  - name: 生成标签，上传固件 
	    uses: ncipollo/release-action@main
	    with:
	  	  tag: worldguard-extraflagsplus
	  	  artifacts: ${{ env.FIRMWARE }}/*
	  	  allowUpdates: true
	  	  removeArtifacts: true
	  	  replacesArtifacts: true
	  	  token: ${{ secrets.GITHUB_TOKEN }}
	  	  body: |
	  	    ====================🧊插件信息🧊=======================
	  	    ➦ 📒 插件名称：worldguard-extraflagsplus
	  	    ➦ 💻 插件平台：Minecraft
	  	    ➦ ⚽ 插件源码：https://github.com/tinsware/WorldGuardExtraFlagsPlus 	  
